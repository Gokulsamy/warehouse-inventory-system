databases:
  - name: warehouse-db
    plan: free
    databaseName: warehouse
    user: warehouse_user

services:
  - type: web
    name: warehouse-inventory-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
